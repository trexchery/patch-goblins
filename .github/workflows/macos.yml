name: macOS application

on:
  pull_request: # not a required check, so docs-only pull requests can skip it outright
    branches: [main]
    paths-ignore: ['**.md', 'assets/**', 'docs/**']
  push:
    branches: [feat/macos-parity]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-orchestration:
    runs-on: macos-14
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Python engine dependencies
        run: uv sync --locked --python python3.12
      - name: Shared orchestration and process lifecycle shard
        run: python3 macos/test-backend.py --shard ${{ matrix.shard }} --count 4
      - name: Real desktop executable, private IPC, and owner approvals
        env:
          PATCH_GOBLINS_TEST_BACKEND: ${{ github.workspace }}/dock/PatchGoblins.Backend/bin/Debug/net8.0/patch-goblins-backend
        run: uv run --python python3.12 pytest tests/test_backend_host.py -n 0
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-${{ matrix.shard }}
          path: |
            TestResults/*.trx
            TestResults/shard-*.json
          if-no-files-found: ignore

  apple-silicon:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build standalone app, installer images, and executable smoke checks
        run: bash macos/build-macos.sh
      - name: Upload Apple Silicon application
        uses: actions/upload-artifact@v4
        with:
          name: patch-goblins-macos-arm64
          path: |
            dist/patch-goblins-macos-arm64.zip
            dist/patch-goblins-macos-arm64.zip.sha256
            dist/patch-goblins-macos-arm64.dmg
            dist/patch-goblins-macos-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30
