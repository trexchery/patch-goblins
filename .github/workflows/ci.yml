name: CI

on:
  push:
    branches: [main, feat/windows-tray]
    paths-ignore: ['**.md', 'assets/**', 'docs/**']
  pull_request: # every pull request: main requires these checks; `changes` skips them for docs-only ones
    branches: [main]

jobs:
  # A docs-only pull request skips the suites below. A job skipped by its `if`
  # reports success, so the required checks pass in seconds. Anything unclear
  # (a failed detection, an empty diff) runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '\.md$|^assets/|^docs/'; then
            echo docs_only=true >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  test-windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        run: uv run pytest

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build engine + Patch Goblins and run all tests (synthetic credentials only)
        shell: pwsh
        run: ./dock/build.ps1

  # The id stays `macos-keychain` although the job now runs everything: it is
  # the name branch protection matches on, and renaming it silently drops the
  # required check.
  macos-keychain:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the whole suite (not only the Keychain files)
        # THE NARROW SELECTION WAS A BLIND SPOT, not a saving. Three cases
        # failed on macOS -- one asserting the Linux XDG layout, two because a
        # usable Keychain takes the write and leaves no `.enc` to chmod --
        # while every job stayed green, because this job never ran them. A merge that
        # restores a two-file selection here re-opens that hole invisibly:
        # those cases pass now, they would simply stop running.
        #
        # faulthandler dumps every thread's stack past the budget, the only
        # clue when a `security` call blocks on an invisible SecurityAgent
        # dialog. While pyproject sets no faulthandler keys this `-o` is the
        # only thing setting the budget and the dump does not abort; PR 287
        # adds them repo-wide at the same 600, after which this is a no-op
        # and the dump aborts the worker. `timeout-minutes` is the backstop
        # that holds under either ordering.
        timeout-minutes: 15
        run: uv run pytest -o faulthandler_timeout=600
